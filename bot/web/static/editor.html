<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правка заметки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #999999);
    --section-bg: var(--tg-theme-section-bg-color, #f3f3f3);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  main {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100vh;
  }
  .header {
    color: var(--hint);
    font-size: 13px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--hint);
    border-bottom-color: rgba(128,128,128,0.2);
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 4px;
  }
  input, textarea {
    width: 100%;
    background: var(--section-bg);
    color: var(--text);
    border: 1px solid rgba(128,128,128,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  input:focus, textarea:focus {
    border-color: var(--button);
  }
  textarea {
    min-height: 120px;
    overflow: hidden;
  }
  .field {
    display: block;
  }
</style>
</head>
<body>
<main>
  <div class="header" id="header"></div>
  <div class="field">
    <label for="title">Заголовок</label>
    <input id="title" type="text" autocomplete="off" autocapitalize="sentences">
  </div>
  <div class="field">
    <label for="body">Текст</label>
    <textarea id="body" rows="6" autocapitalize="sentences"></textarea>
  </div>
</main>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) {
    document.body.textContent = "Эта страница работает только внутри Telegram.";
    return;
  }
  tg.ready();
  tg.expand();

  const init = window.__INIT__ || {};
  const headerEl = document.getElementById("header");
  const titleEl = document.getElementById("title");
  const bodyEl = document.getElementById("body");

  const wsLabels = {
    personal: "personal",
    work: "work",
    family: "family",
    growth: "growth",
    ai_path: "ai_path",
  };
  const typeIcons = {
    note: "📝",
    task: "✅",
    idea: "💡",
    meeting: "🗓️",
    "1on1": "👥",
  };
  const wsLabel = wsLabels[init.workspace] || init.workspace || "";
  const typeIcon = typeIcons[init.note_type] || "📝";
  const typeLabel = init.note_type || "note";
  headerEl.textContent = `📁 ${wsLabel} · ${typeIcon} ${typeLabel}`;

  titleEl.value = init.title || "";
  bodyEl.value = init.body || "";

  function autogrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  autogrow(bodyEl);
  bodyEl.addEventListener("input", () => autogrow(bodyEl));

  const mainBtn = tg.MainButton;
  mainBtn.setText("Сохранить");
  mainBtn.show();
  mainBtn.enable();

  const backBtn = tg.BackButton;
  backBtn.show();
  backBtn.onClick(() => tg.close());

  let busy = false;
  async function submit() {
    if (busy) return;
    busy = true;
    mainBtn.showProgress();
    try {
      const r = await fetch("/edit/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": tg.initData,
        },
        body: JSON.stringify({
          draft_id: init.draft_id,
          title: titleEl.value,
          body: bodyEl.value,
        }),
      });
      if (!r.ok) {
        let msg = `Ошибка ${r.status}`;
        try {
          const j = await r.json();
          if (j && j.error) msg = j.error;
        } catch (_) {}
        tg.HapticFeedback.notificationOccurred("error");
        tg.showAlert(msg);
        return;
      }
      tg.HapticFeedback.notificationOccurred("success");
      tg.close();
    } catch (err) {
      tg.HapticFeedback.notificationOccurred("error");
      tg.showAlert("Сеть недоступна. Попробуй ещё раз.");
    } finally {
      mainBtn.hideProgress();
      busy = false;
    }
  }
  mainBtn.onClick(submit);
})();
</script>
</body>
</html>
