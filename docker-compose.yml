services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - notes_tmp:/tmp/notes-bot
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sqlite3, os; sqlite3.connect(os.environ.get('DATABASE_PATH','data/notes.db')).execute('SELECT 1').fetchone()" || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  notes_tmp:
